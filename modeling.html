<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modeling | FIA CHA</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="category.css" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;300;400&display=swap" rel="stylesheet" />
</head>
<body class="category-page feature-page" data-category="modeling">
  <a class="category-back-button" href="index.html" aria-label="Back to FIA CHA main page">Back</a>

  <header class="category-header">
    <a class="home-link" href="index.html" aria-label="Back to home">FIA CHA</a>
    <h1 class="category-title">Modeling</h1>
  </header>

  <main class="category-main">
    <section class="film-gallery" aria-label="Modeling projects">
      <button class="vertical-film vertical-film--hero" type="button" data-film="film1" aria-label="Modeling project 1">
        <img src="assets/images/film_frame2_v2.webp" alt="" />
      </button>
      <button class="vertical-film vertical-film--mid" type="button" data-film="film2" aria-label="Modeling project 2">
        <img src="assets/images/film_frame2_v2.webp" alt="" />
      </button>
      <button class="vertical-film vertical-film--right" type="button" data-film="film3" aria-label="Modeling project 3">
        <img src="assets/images/film_frame2_v2.webp" alt="" />
      </button>
      <button class="vertical-film vertical-film--back" type="button" data-film="film4" aria-label="Modeling project 4">
        <img src="assets/images/film_frame2_v2.webp" alt="" />
      </button>
    </section>

    <section class="feature-detail" aria-label="Selected modeling project" aria-hidden="true">
      <button class="detail-back-button" type="button" aria-label="Back to modeling gallery">Back</button>
      <button class="feature-detail-film" type="button" aria-label="Back to modeling gallery">
        <img src="assets/images/film_frame2_v2.webp" alt="" />
      </button>
      <div class="feature-detail-panel" aria-label="Project detail area">
        <div class="feature-detail-content">
          <section class="project-overview" aria-label="Project overview">
            <div class="project-copy">
              <h2 class="project-title" data-project-title>Title</h2>
              <dl class="project-meta">
                <div><dt>제작년도</dt><dd data-project-year></dd></div>
                <div><dt>러닝타임</dt><dd data-project-runtime></dd></div>
                <div><dt>사용 툴</dt><dd data-project-tools></dd></div>
                <div><dt>참여파트</dt><dd data-project-role></dd></div>
              </dl>
            </div>
            <div class="feature-video">
              <iframe data-project-youtube title="Modeling video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </div>
          </section>
          <section class="project-description" aria-label="Project description">
            <h3>Description</h3>
            <p data-project-description></p>
          </section>
          <section class="project-process" aria-label="Production process">
            <h3>Process</h3>
            <div class="project-stills" data-project-stills></div>
            <div class="project-process-list" data-project-process></div>
          </section>
        </div>
      </div>
    </section>
  </main>

  <script src="category.js"></script>
</body>
</html>
